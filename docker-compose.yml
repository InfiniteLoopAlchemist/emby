services:
  emby:
    image: emby/embyserver:latest
    container_name: embyserver
    runtime: nvidia
    network_mode: host
    environment:
      - UID=1000
      - GID=1000
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - TZ=America/New_York
      - GIDLIST=1000,999
    volumes:
      - ./config:/config
      - ./custom-images:/custom-images
      - ./scripts:/scripts
      - /mnt/nas:/media
      - /mnt/nasmom:/media-mom
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    entrypoint: /bin/sh -c "rm -rf /config/cache/images/* && /scripts/copy_images.sh && /scripts/replace_images.sh && /init"

  monitor:
    image: alpine:latest
    container_name: monitor_plugins
    volumes:
      - ./config:/config
      - ./custom-images:/custom-images
      - ./scripts:/scripts
      - /home/john/

